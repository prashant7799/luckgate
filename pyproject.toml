[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "luckgate"
dynamic = ["version"]
description = "Did the winner of a search beat luck? Deflated Sharpe ratio, CSCV probability of backtest overfitting and a pass/fail checklist."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "Prashant Lohar", email = "120216391+prashant7799@users.noreply.github.com" },
]
keywords = [
    "deflated-sharpe-ratio",
    "probabilistic-sharpe-ratio",
    "backtest-overfitting",
    "cscv",
    "multiple-testing",
    "selection-bias",
    "model-selection",
    "statistics",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Education",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Mathematics",
    "Typing :: Typed",
]
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "hypothesis>=6.90",
    "ruff==0.17.1",  # the same version as CI, so lint results match
]

[project.scripts]
luckgate = "luckgate.cli:main"

[project.urls]
Homepage = "https://github.com/prashant7799/luckgate"
Issues = "https://github.com/prashant7799/luckgate/issues"
Changelog = "https://github.com/prashant7799/luckgate/blob/main/CHANGELOG.md"

[tool.hatch.version]
path = "src/luckgate/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/luckgate"]

[tool.hatch.build.targets.sdist]
include = [
    "src/luckgate",
    "tests",
    "examples",
    "README.md",
    "CHANGELOG.md",
    "CONTRIBUTING.md",
    "CITATION.cff",
    "LICENSE",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "NPY"]

[tool.ruff.lint.isort]
known-first-party = ["luckgate"]
